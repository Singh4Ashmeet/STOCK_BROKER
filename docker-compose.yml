# docker-compose.yml - Local development infrastructure for stock_broker
# Profiles: core, analytics, obs, bus, app
# Usage: docker compose --profile core --profile analytics --profile obs up -d
# All ports bound to 127.0.0.1 only. No secrets in this file - use .env

# version: "3.9"  # Removed: Compose v2 ignores it

services:
  # ============================================================
  # CORE PROFILE: Postgres, Redis
  # ============================================================
  postgres:
    image: postgres:16.4-alpine
    profiles: ["core"]
    container_name: sb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockbroker
      POSTGRES_USER: sb_migrator
      POSTGRES_PASSWORD: "${SB_POSTGRES_MIGRATOR_PASSWORD}"
      SB_POSTGRES_APP_PASSWORD: "${SB_POSTGRES_APP_PASSWORD}"
      SB_POSTGRES_READONLY_PASSWORD: "${SB_POSTGRES_READONLY_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${SB_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb_migrator -d stockbroker"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - sb_internal

  redis:
    image: redis:7.4-alpine
    profiles: ["core"]
    container_name: sb_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SB_REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${SB_REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SB_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - sb_internal

  # ============================================================
  # ANALYTICS PROFILE: ClickHouse
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["analytics"]
    container_name: sb_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: stockbroker
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "${SB_CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      SB_CLICKHOUSE_APP_PASSWORD_SHA256: "${SB_CLICKHOUSE_APP_PASSWORD_SHA256}"
      # Admin user (default) created via CLICKHOUSE_USER/CLICKHOUSE_PASSWORD
      # App user (sb_app) created via users.d template
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/users.d/app-user.xml.template:/etc/clickhouse-server/users.d/app-user.xml.template:ro
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ports:
      - "127.0.0.1:${SB_CLICKHOUSE_HTTP_PORT}:8123"
      - "127.0.0.1:${SB_CLICKHOUSE_NATIVE_PORT}:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1", "--user", "default", "--password", "${SB_CLICKHOUSE_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - sb_internal
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ============================================================
  # OBS PROFILE: Prometheus, Grafana
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    container_name: sb_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - prometheus_data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${SB_PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - sb_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.4
    profiles: ["obs"]
    container_name: sb_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${SB_GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${SB_GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: "http://127.0.0.1:${SB_GRAFANA_PORT}/"
      GF_SERVER_DOMAIN: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${SB_GRAFANA_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - sb_internal

  # ============================================================
  # BUS PROFILE: Redpanda (single node, dev mode) - OFF BY DEFAULT
  # ============================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.10
    profiles: ["bus"]
    container_name: sb_redpanda
    restart: unless-stopped
    command:
      - "redpanda"
      - "start"
      - "--smp=1"
      - "--memory=512M"
      - "--reserve-memory=128M"
      - "--overprovisioned"
      - "--node-id=0"
      - "--kafka-addr=PLAINTEXT://0.0.0.0:9092"
      - "--advertise-kafka-addr=PLAINTEXT://redpanda:9092"
      - "--rpc-addr=0.0.0.0:33145"
      - "--advertise-rpc-addr=redpanda:33145"
    ports:
      - "127.0.0.1:${SB_REDPANDA_PORT}:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - sb_internal

