[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockbroker-data-quality"
version = "0.1.0"
description = "Data quality loader and validator for Parquet event files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=12.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

[project.scripts]
sb-dq-validate = "stockbroker_dq.cli:validate_cmd"
sb-dq-report = "stockbroker_dq.cli:report_cmd"
sb-dq-convert = "stockbroker_dq.cli:convert_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/stockbroker_dq/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]