[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pybook"
version = "0.1.0"
description = "PyO3 bindings for stock_broker order book, metrics and event log reader"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.maturin]
manifest-path = "../rust/pybook/Cargo.toml"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
python-source = "src"
module-name = "pybook._pybook"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath = ["src"]
