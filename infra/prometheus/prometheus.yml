# infra/prometheus/prometheus.yml
# Prometheus configuration for stock_broker local development
# Scrape targets for feed, api, research, and self
# Targets use host.docker.internal which requires extra_hosts in compose

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local'
    environment: 'dev'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Rust feed service (not running yet - placeholder for Phase 2)
  # Exposes metrics on port 9100
  - job_name: 'feed'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Java API service (not running yet - placeholder for Phase 4)
  # Spring Boot Actuator Prometheus endpoint on port 8081
  - job_name: 'api'
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s

  # Python research service (not running yet - placeholder for Phase 6)
  # Exposes metrics on port 9101
  - job_name: 'research'
    static_configs:
      - targets: ['host.docker.internal:9101']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node exporter for host metrics (optional - run separately if needed)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']

  # Redis exporter (optional - run separately if needed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['host.docker.internal:9121']

  # Postgres exporter (optional - run separately if needed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['host.docker.internal:9187']
