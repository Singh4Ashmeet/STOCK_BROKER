# infra/prometheus/alerts.yml
# Prometheus alerting rules for stock_broker
# Implements the alert table from docs/11-PERFORMANCE-AND-OBSERVABILITY.md section 7
# Uses metric names from docs/11 section 5
# Runbook annotations are placeholders - to be filled in Phase 8

groups:
  - name: stockbroker_feed
    interval: 30s
    rules:
      # Feed disconnected: up == 0 or reconnect rate high for 2 min
      - alert: FeedDisconnected
        expr: |
          up{job="feed"} == 0
          or
          increase(feed_reconnect_total[2m]) > 5
        for: 2m
        labels:
          severity: critical
          component: feed
        annotations:
          summary: "Feed service disconnected or reconnecting frequently"
          description: "Feed has been down or reconnecting frequently for 2 minutes. Check network connectivity to exchange and feed logs."
          runbook: "TODO: Link to runbook (Phase 8)"

      # Book invalid too long: feed_book_valid == 0 for over 30 s
      - alert: BookInvalidTooLong
        expr: |
          feed_book_valid{symbol=~".+"} == 0
        for: 30s
        labels:
          severity: critical
          component: feed
        annotations:
          summary: "Order book invalid for {{ $labels.symbol }}"
          description: "Book validity gauge is 0 for {{ $labels.symbol }} for over 30 seconds. Possible data gap or parse error."
          runbook: "TODO: Link to runbook (Phase 8)"

      # Any mismatch: increase(feed_book_mismatch_total[1h]) > 0
      - alert: BookMismatchDetected
        expr: |
          increase(feed_book_mismatch_total[1h]) > 0
        for: 1m
        labels:
          severity: critical
          component: feed
        annotations:
          summary: "Order book mismatch detected"
          description: "Book mismatch counter increased in the last hour. This indicates a correctness issue in the book implementation."
          runbook: "TODO: Link to runbook (Phase 8)"

      # Latency budget breach: p99 internal over budget for 5 min
      # Budget from docs/11: p99 internal (T4-T1) under 1ms
      - alert: LatencyBudgetBreach
        expr: |
          histogram_quantile(0.99, sum by (le, stage) (rate(feed_stage_latency_seconds_bucket{stage="internal"}[5m]))) > 0.001
        for: 5m
        labels:
          severity: warning
          component: feed
        annotations:
          summary: "Feed internal latency p99 over 1ms budget"
          description: "Rust internal latency (T4-T1) p99 has exceeded 1ms for 5 minutes. Current p99: {{ $value }}s"
          runbook: "TODO: Link to runbook (Phase 8)"

      # Conflation spike: conflation rate above threshold
      - alert: ConflationSpike
        expr: |
          rate(feed_conflation_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
          component: feed
        annotations:
          summary: "High conflation rate in feed"
          description: "Feed conflation rate exceeds 100/s. This may indicate slow consumers or backpressure."
          runbook: "TODO: Link to runbook (Phase 8)"

      # Event log dropping: feed_log_dropped_total increasing
      - alert: EventLogDropping
        expr: |
          increase(feed_log_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: feed
        annotations:
          summary: "Event log records being dropped"
          description: "Feed log writer is dropping records. Check disk space and writer throughput."
          runbook: "TODO: Link to runbook (Phase 8)"

  - name: stockbroker_resources
    interval: 30s
    rules:
      # Disk low: free space under 15 percent
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Disk space below 15%"
          description: "Available disk space on root filesystem is below 15%. Current: {{ $value | humanizePercentage }}"
          runbook: "TODO: Link to runbook (Phase 8)"

  - name: stockbroker_trading
    interval: 30s
    rules:
      # Ledger diff: ledger_reconciliation_diff != 0
      - alert: LedgerReconciliationDiff
        expr: |
          ledger_reconciliation_diff != 0
        for: 1m
        labels:
          severity: critical
          component: trading
        annotations:
          summary: "Ledger reconciliation difference detected"
          description: "Ledger reconciliation job found a non-zero difference. This indicates a correctness issue in the ledger."
          runbook: "TODO: Link to runbook (Phase 8)"

  - name: stockbroker_security
    interval: 30s
    rules:
      # Auth anomaly: failure rate spike
      - alert: AuthFailureSpike
        expr: |
          rate(auth_failures_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Authentication failure rate spike"
          description: "Auth failure rate exceeds 10/min. Possible credential stuffing attack."
          runbook: "TODO: Link to runbook (Phase 8)"

      # Token reuse detected (critical - indicates compromise)
      - alert: RefreshTokenReuseDetected
        expr: |
          increase(refresh_reuse_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: security
        annotations:
          summary: "Refresh token reuse detected"
          description: "A rotated refresh token was reused. The entire token family has been revoked. Possible token theft."
          runbook: "TODO: Link to runbook (Phase 8)"

      # Rate limit hits spike
      - alert: RateLimitSpike
        expr: |
          rate(rate_limited_total[5m]) > 50
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High rate limit hit rate"
          description: "Rate limiter is rejecting over 50 requests/minute. Check for abusive clients or misconfigured limits."
          runbook: "TODO: Link to runbook (Phase 8)"

  - name: stockbroker_fanout
    interval: 30s
    rules:
      # WebSocket session/conflation alerts
      - alert: WSSessionCountHigh
        expr: |
          ws_sessions > 10000
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High WebSocket session count"
          description: "WebSocket sessions exceed 10,000. Check for connection leaks or unexpected load."
          runbook: "TODO: Link to runbook (Phase 8)"

      - alert: WSConflationSpike
        expr: |
          rate(ws_conflations_total[5m]) > 1000
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "WebSocket conflation spike"
          description: "WebSocket conflation rate exceeds 1000/s. Slow clients may be getting disconnected."
          runbook: "TODO: Link to runbook (Phase 8)"
