# .pre-commit-config.yaml
# See https://pre-commit.com/ for documentation
# Install: pip install pre-commit && pre-commit install --install-hooks -t pre-commit -t commit-msg
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Gitleaks for secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Shellcheck for shell scripts (using shellcheck-py for portability)
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # Conventional Commits enforcement
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
        args: ['--check']

  # YAML linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']

  # Local hook: check GitHub Action pins
  - repo: local
    hooks:
      - id: check-action-pins
        name: Check GitHub Action pins
        entry: bash scripts/check-action-pins.sh
        language: system
        files: '\.github/workflows/.*\.ya?ml$'
        pass_filenames: false

ci:
  autofix_commit_msg: "style: pre-commit auto-fixes"
  autofix_prs: true
  skip: [gitleaks]  # gitleaks is slow, run in CI instead
