# Test profile configuration
# Enables mock feed for testing

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${SB_POSTGRES_HOST:localhost}:${SB_POSTGRES_PORT:5432}/${SB_POSTGRES_DB:stockbroker}
    username: ${SB_POSTGRES_USER:sb_app}
    password: ${SB_POSTGRES_PASSWORD:${SB_POSTGRES_APP_PASSWORD:Bu59j3pD2y3GXnY3aHsxa5jFPjgPt3i1}}
  data:
    redis:
      host: ${SB_REDIS_HOST:localhost}
      port: ${SB_REDIS_PORT:6379}
      password: ${SB_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  task:
    scheduling:
      pool:
        size: 1
  rsocket:
    server:
      port: 0

# Enable mock feed for tests
sb:
  auth:
    jwt:
      private-key-path: ${SB_JWT_PRIVATE_KEY_PATH:file:../infra/secrets/jwt_private.key}
      public-key-path: ${SB_JWT_PUBLIC_KEY_PATH:file:../infra/secrets/jwt_public.key}
  market:
    gateway:
      host: ${SB_FEED_HOST:localhost}
      port: ${SB_FEED_GRPC_PORT:9000}
      plaintext: true
      connect-timeout: 5s
      keepalive:
        interval-seconds: 20
        timeout-seconds: 10
      subscription-manager:
        max-symbols-per-connection: 100
        max-messages-per-symbol: 1024
      redis-mirror:
        enabled: false
  rate-limit:
    enabled: true
    default-requests-per-minute: 1000
    auth-requests-per-minute: 100
    market-requests-per-minute: 2000
    trading-requests-per-minute: 500
    key-prefix: rl
  golden-vectors:
    dir: testdata/golden_fills
