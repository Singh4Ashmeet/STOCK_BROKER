# Test profile configuration
# Enables mock feed for testing

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${SB_POSTGRES_HOST:localhost}:${SB_POSTGRES_PORT:5432}/${SB_POSTGRES_DB:stockbroker_test}
    username: ${SB_POSTGRES_USER:stockbroker_test}
    password: ${SB_POSTGRES_PASSWORD:stockbroker_test}
  data:
    redis:
      host: ${SB_REDIS_HOST:localhost}
      port: ${SB_REDIS_PORT:6379}
      password: ${SB_REDIS_PASSWORD:}
  task:
    scheduling:
      pool:
        size: 1

# Enable mock feed for tests
sb:
  market:
    gateway:
      mock: true
      host: localhost
      port: 9999
      plaintext: true
      connect-timeout: 1s
      keepalive:
        interval-seconds: 20
        timeout-seconds: 10
      subscription-manager:
        max-symbols-per-connection: 100
        max-messages-per-symbol: 1024
      redis-mirror:
        enabled: false

# Test-specific application settings
sb:
  rate-limit:
    enabled: true
    default-requests-per-minute: 1000
    auth-requests-per-minute: 100
    market-requests-per-minute: 2000
    trading-requests-per-minute: 500
    key-prefix: rl

# Golden vectors output directory
sb:
  golden-vectors:
    dir: testdata/golden_fills
