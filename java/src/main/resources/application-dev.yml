# Development profile overrides
# Activated with: spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:postgresql://${SB_POSTGRES_HOST:localhost}:${SB_POSTGRES_PORT:5432}/${SB_POSTGRES_DB:stockbroker}
    username: ${SB_POSTGRES_USER:sb_app}
    password: ${SB_POSTGRES_PASSWORD:${SB_POSTGRES_APP_PASSWORD:Bu59j3pD2y3GXnY3aHsxa5jFPjgPt3i1}}
  data:
    redis:
      password: ${SB_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    com.stockbroker: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
    org.jooq: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Development: allow all origins for CORS
sb:
  cors:
    allowed-origins: "*"