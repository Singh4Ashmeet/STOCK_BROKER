# Development profile overrides
# Activated with: spring.profiles.active=dev

spring:
  jpa:
    show-sql: true
  sql:
    init:
      mode: never

logging:
  level:
    com.stockbroker: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
    org.jooq: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Development: allow all origins for CORS
sb:
  cors:
    allowed-origins: "*"