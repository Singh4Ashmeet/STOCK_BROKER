name: Python

on:
  pull_request:
    paths:
      - 'python/**'
      - 'proto/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/python.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'proto/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if [ -d python ] && [ -f python/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -q ruff mypy
      - name: Ruff lint
        run: ruff check .
        working-directory: python
      - name: Mypy type check
        run: mypy --strict .
        working-directory: python

  test:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -q pytest pytest-cov maturin
          pip install -e '.[test]'
        working-directory: python
      - name: Generate recorded day for tests
        run: cargo run -p sb-pybook --example generate_day -- ../testdata/recorded_day
        working-directory: rust
      - name: Run tests
        run: pytest --cov=python --cov-report=xml
        working-directory: python

  wheels:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release
        working-directory: python
      - name: Upload wheel artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: wheels
          path: target/wheels/*.whl

  pip-audit:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Generate requirements file from pyproject.toml
        id: gen-req-file
        working-directory: python
        run: |
          python -c "
import tomllib
import tempfile
import sys
with open('pyproject.toml', 'rb') as f:
    data = tomllib.load(f)
deps = data.get('project', {}).get('dependencies', [])
if not deps:
    print('No dependencies found in pyproject.toml')
    sys.exit(0)
with tempfile.NamedTemporaryFile(mode='w', suffix='.txt', delete=False) as f:
    for dep in deps:
        f.write(dep + '\n')
    req_file = f.name
    print(req_file)
    echo \"req_file=$req_file\" >> $GITHUB_OUTPUT
  "
      - name: Run pip-audit with generated requirements
        run: pip-audit -r ${{ steps.gen-req-file.outputs.req_file }}
        working-directory: python
