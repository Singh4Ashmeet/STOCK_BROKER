name: Java

on:
  pull_request:
    paths:
      - 'java/**'
      - 'proto/**'
      - 'gradle*.properties'
      - 'settings.gradle*'
      - '.github/workflows/java.yml'
  push:
    branches: [main]
    paths:
      - 'java/**'
      - 'proto/**'
      - 'gradle*.properties'
      - 'settings.gradle*'
      - '.github/workflows/java.yml'

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d java ] && [ -f java/build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Build
        run: ./gradlew build --no-daemon
        working-directory: java

  test:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: ./gradlew test --no-daemon
        working-directory: java

  dependency-check:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'stockbroker-java'
          path: 'java'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --skipProvidedScope true
            --suppression ${GITHUB_WORKSPACE}/java/dependency-check-suppressions.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: java/reports/