name: Java

on:
  pull_request:
    paths:
      - 'java/**'
      - 'proto/**'
      - 'gradle*.properties'
      - 'settings.gradle*'
      - '.github/workflows/java.yml'
  push:
    branches: [main]
    paths:
      - 'java/**'
      - 'proto/**'
      - 'gradle*.properties'
      - 'settings.gradle*'
      - '.github/workflows/java.yml'

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: check
        run: |
          if [ -d java ] && [ -f java/build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Build
        run: ./gradlew build --no-daemon
        working-directory: java

  test:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: ./gradlew test --no-daemon
        working-directory: java

  dependency-check:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      # TODO(Phase 4): Replace with Gradle/Maven Dependency-Check plugin when Java project exists
      # - name: OWASP Dependency Check
      #   uses: dependency-check/Dependency-Check_Action@<pinned-sha> # vX.Y.Z
      #   with:
      #     project: 'stockbroker-java'
      #     path: 'java'
      #     format: 'HTML'
      #     out: 'reports'
      #     args: >
      #       --failOnCVSS 7
      #       --skipProvidedScope true
      #       --suppression ${GITHUB_WORKSPACE}/java/dependency-check-suppressions.xml
      - name: Placeholder - Dependency Check not yet configured
        run: echo "Dependency-Check will be run via Gradle plugin in Phase 4 (see docs/12-DEVOPS-DEPLOYMENT.md)"
