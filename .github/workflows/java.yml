name: Java CI

on:
  push:
    branches: [main]
    paths: ['java/**', 'proto/**', '.github/workflows/java.yml']
  pull_request:
    branches: [main]
    paths: ['java/**', 'proto/**', '.github/workflows/java.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        run: ./mvnw clean compile -B
        working-directory: java
      - name: Start native test services
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql --set ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            CREATE ROLE stockbroker_test LOGIN PASSWORD 'stockbroker_test';
          EXCEPTION WHEN duplicate_object THEN
            ALTER ROLE stockbroker_test WITH LOGIN PASSWORD 'stockbroker_test';
          END $$;
          CREATE DATABASE stockbroker_test OWNER stockbroker_test;
          SQL
        shell: bash
      - name: Run unit tests
        run: ./mvnw test -B
        working-directory: java
        env:
          SB_POSTGRES_DB: stockbroker_test
          SB_POSTGRES_USER: stockbroker_test
          SB_POSTGRES_PASSWORD: stockbroker_test
      - name: Run static analysis
        run: ./mvnw spotbugs:check checkstyle:check -B
        working-directory: java
