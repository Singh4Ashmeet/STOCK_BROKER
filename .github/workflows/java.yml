name: Java CI

on:
  push:
    branches: [main]
    paths: ['java/**', 'proto/**', '.github/workflows/java.yml']
  pull_request:
    branches: [main]
    paths: ['java/**', 'proto/**', '.github/workflows/java.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        run: ./mvnw clean compile -B
        working-directory: java
      - name: Run unit tests
        run: ./mvnw test -B
        working-directory: java
      - name: Run static analysis
        run: ./mvnw spotbugs:check checkstyle:check -B
        working-directory: java
