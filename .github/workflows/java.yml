name: Java CI

on:
  push:
    branches: [main]
    paths: ['java/**', 'proto/**', '.github/workflows/java.yml']
  pull_request:
    branches: [main]
    paths: ['java/**', 'proto/**', '.github/workflows/java.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate test JWT keypair
        shell: bash
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/jwt_private.key" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/jwt_private.key" -pubout -out "$RUNNER_TEMP/jwt_public.key" 2>/dev/null
          echo "SB_JWT_PRIVATE_KEY_PATH=file:$RUNNER_TEMP/jwt_private.key" >> "$GITHUB_ENV"
          echo "SB_JWT_PUBLIC_KEY_PATH=file:$RUNNER_TEMP/jwt_public.key" >> "$GITHUB_ENV"
      - name: Compile
        run: ./mvnw clean compile -B
        working-directory: java
      - name: Start native test services
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql --set ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            CREATE ROLE stockbroker_test LOGIN PASSWORD 'stockbroker_test';
          EXCEPTION WHEN duplicate_object THEN
            ALTER ROLE stockbroker_test WITH LOGIN PASSWORD 'stockbroker_test';
          END $$;
          CREATE DATABASE stockbroker_test OWNER stockbroker_test;
          SQL
        shell: bash
      - name: Run unit tests
        run: |
          set +e
          ./mvnw test -B 2>&1 | tee maven-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 30 maven-test.log | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=Maven test failure::$summary"
          fi
          exit "$status"
        shell: bash
        working-directory: java
        env:
          SPRING_PROFILES_ACTIVE: test
          SB_POSTGRES_DB: stockbroker_test
          SB_POSTGRES_USER: stockbroker_test
          SB_POSTGRES_PASSWORD: stockbroker_test
      - name: Publish test failure summary
        if: failure()
        continue-on-error: true
        working-directory: java
        shell: bash
        run: |
          summary="$(grep -REm 1 '<(failure|error)' target/surefire-reports 2>/dev/null | sed 's/<[^>]*>/ /g' | tr '\n' ' ' | cut -c1-1500 || true)"
          echo "::error title=Surefire failure::$summary"
      - name: Run static analysis
        run: ./mvnw spotbugs:check checkstyle:check -B
        working-directory: java
