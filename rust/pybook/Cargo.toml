[package]
name = "sb-pybook"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "PyO3 bindings for stock_broker order book, metrics and event log reader"
license = "MIT OR Apache-2.0"

[lib]
name = "pybook"
crate-type = ["cdylib", "rlib"]

[dependencies]
sb-core = { path = "../core" }
sb-book = { path = "../book" }
sb-metrics = { path = "../metrics" }
sb-replay = { path = "../replay" }
thiserror = { workspace = true }
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
numpy = "0.22"

[dev-dependencies]
tempfile = "3.16"
sb-server = { path = "../server" }
