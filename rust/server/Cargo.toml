[package]
name = "sb-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "gRPC MarketData service with conflation, epoch/seq, health, and Prometheus"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sb-server"
path = "src/main.rs"

[dependencies]
sb-core = { path = "../core" }
sb-book = { path = "../book" }
sb-metrics = { path = "../metrics" }
thiserror = { workspace = true }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
async-stream = "0.3"
hdrhistogram = "7.5"
prometheus = "0.14"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
parking_lot = "0.12"
once_cell = "1.19"
serde_json = "1.0.151"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.16"
tonic = { version = "0.12", features = ["transport"] }
tokio = { version = "1", features = ["full", "test-util"] }
