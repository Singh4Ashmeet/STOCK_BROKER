[workspace]
resolver = "2"
members = [
    "core",
    "book",       # Optimized order book and the BTreeMap oracle. No I/O, no async.
    "connectors", # Exchange trait + Binance implementation.
    "metrics",    # Incremental metrics (spread, mid, microprice, depth, imbalance, VWAP).
    "replay",     # Event-log writer thread and replay driver.
    "server",     # gRPC service, config, health/metrics endpoint.
    "pybook",     # PyO3 bindings (maturin) for Python.
]

exclude = [
    "core/fuzz",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
thiserror = "1.0"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
proptest = "1.0"


[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
arithmetic_side_effects = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# panic = "abort" is set per-binary (feed binary will set it; pybook needs unwinding)

[profile.bench]
inherits = "release"
