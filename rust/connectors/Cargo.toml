[package]
name = "sb-connectors"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Exchange connectors: WebSocket lifecycle, rate limits, normalization, and orderbook synchronizer"
license = "MIT OR Apache-2.0"

[dependencies]
sb-core = { path = "../core" }
sb-book = { path = "../book" }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rand = "0.9"
clap = { version = "4.5", features = ["derive"], optional = true }
bytes = "1.9"

[dev-dependencies]
proptest = { workspace = true }
tokio = { version = "1.43", features = ["rt", "macros", "time"] }

[[bin]]
name = "binance-feed"
path = "src/bin/binance_feed.rs"
required-features = ["cli"]

[[bin]]
name = "capture-tool"
path = "src/bin/capture_tool.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:tracing-subscriber"]
